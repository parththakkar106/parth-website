name: Refresh GitHub contributions

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch contribution calendar
        env:
          # A token that can read the profile's contribution calendar. The default token works
          # because private contributions are shown on the public profile; CONTRIB_TOKEN overrides it.
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || github.token }}
        run: node scripts/fetch-contributions.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/contributions.json
          git diff --cached --quiet || (git commit -m "Refresh GitHub contributions" && git push)
